name: Build SensexAlert APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # Checkout
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # Java
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # Android SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"


      # =========================================================
      # Gradle
      # =========================================================

      - name: Install Gradle
        run: |
          curl -L \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"


      # =========================================================
      # Create Android project
      # =========================================================

      - name: Create project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/praveen/sensexalert
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml


          # =====================================================
          # settings.gradle
          # =====================================================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'SensexAlert'

          include ':app'
          EOF


          # =====================================================
          # Root build.gradle
          # =====================================================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          # =====================================================
          # gradle.properties
          # =====================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF


          # =====================================================
          # app/build.gradle
          # =====================================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.praveen.sensexalert'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.praveen.sensexalert'

                  minSdk 26

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }
          }
          EOF


          # =====================================================
          # strings.xml
          # =====================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">SensexAlert</string>

              <string name="wallpaper_description">
                  SENSEX Live Market Dashboard
              </string>

          </resources>
          EOF


          # =====================================================
          # styles.xml
          # =====================================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                     parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

              </style>

          </resources>
          EOF


          # =====================================================
          # wallpaper.xml
          # =====================================================

          cat > app/src/main/res/xml/wallpaper.xml <<'EOF'
          <wallpaper
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description" />
          EOF


          # =====================================================
          # AndroidManifest.xml
          # =====================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />


              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">


                  <!-- Main Activity -->

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <!-- Live Wallpaper Service -->

                  <service
                      android:name=".SensexWallpaperService"
                      android:exported="true"
                      android:permission="android.permission.BIND_WALLPAPER">

                      <intent-filter>

                          <action
                              android:name="android.service.wallpaper.WallpaperService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />

                  </service>

              </application>

          </manifest>
          EOF


          # =====================================================
          # MainActivity.java
          # =====================================================

          cat > app/src/main/java/com/praveen/sensexalert/MainActivity.java <<'EOF'
          package com.praveen.sensexalert;

          import android.app.Activity;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.WallpaperManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URLEncoder;
          import java.net.URL;
          import java.time.LocalDate;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;


          public class MainActivity extends Activity {


              private static final String PREFS =
                      "sensex_alert";


              private static final String TOKEN =
                      "analytics_token";


              /*
               * Upstox instrument key for SENSEX.
               */
              private static final String SENSEX =
                      "BSE_INDEX|SENSEX";


              private final ExecutorService executor =
                      Executors.newSingleThreadExecutor();


              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper()
                      );


              private TextView sensexText;

              private TextView pcrText;

              private TextView maxPainText;

              private TextView putOiText;

              private TextView callOiText;

              private TextView statusText;


              private EditText tokenInput;


              /*
               * Refresh market data every 60 seconds.
               */
              private final Runnable refreshRunnable =
                      new Runnable() {

                          @Override
                          public void run() {

                              loadMarketData();

                              handler.postDelayed(
                                      this,
                                      60000
                              );
                          }
                      };


              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );


                  createNotificationChannel();


                  buildUi();


                  String saved =
                          getSharedPreferences(
                                  PREFS,
                                  MODE_PRIVATE
                          )
                          .getString(
                                  TOKEN,
                                  ""
                          );


                  tokenInput.setText(
                          saved
                  );
              }


              /*
               * Build application UI.
               */
              private void buildUi() {

                  ScrollView scroll =
                          new ScrollView(
                                  this
                          );


                  LinearLayout root =
                          new LinearLayout(
                                  this
                          );


                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  root.setPadding(
                          32,
                          32,
                          32,
                          32
                  );


                  root.setBackgroundColor(
                          Color.BLACK
                  );


                  TextView title =
                          text(
                                  "SENSEX ALERT",
                                  28,
                                  Color.WHITE
                          );


                  root.addView(
                          title
                  );


                  /*
                   * Upstox Analytics Token
                   */
                  tokenInput =
                          new EditText(
                                  this
                          );


                  tokenInput.setHint(
                          "Paste Upstox Analytics Token"
                  );


                  tokenInput.setTextColor(
                          Color.WHITE
                  );


                  tokenInput.setHintTextColor(
                          Color.GRAY
                  );


                  tokenInput.setSingleLine(
                          true
                  );


                  root.addView(
                          tokenInput
                  );


                  /*
                   * Save token button
                   */
                  Button save =
                          new Button(
                                  this
                          );


                  save.setText(
                          "SAVE TOKEN"
                  );


                  root.addView(
                          save
                  );


                  save.setOnClickListener(
                          v -> {

                              getSharedPreferences(
                                      PREFS,
                                      MODE_PRIVATE
                              )
                              .edit()
                              .putString(
                                      TOKEN,
                                      tokenInput
                                              .getText()
                                              .toString()
                                              .trim()
                              )
                              .apply();


                              loadMarketData();
                          }
                  );


                  /*
                   * SENSEX
                   */
                  sensexText =
                          text(
                                  "SENSEX --",
                                  30,
                                  Color.WHITE
                          );


                  /*
                   * PCR
                   */
                  pcrText =
                          text(
                                  "PCR --",
                                  22,
                                  Color.WHITE
                          );


                  /*
                   * Max Pain
                   */
                  maxPainText =
                          text(
                                  "MAX PAIN --",
                                  22,
                                  Color.WHITE
                          );


                  /*
                   * Put OI
                   */
                  putOiText =
                          text(
                                  "PUT OI --",
                                  22,
                                  Color.WHITE
                          );


                  /*
                   * Call OI
                   */
                  callOiText =
                          text(
                                  "CALL OI --",
                                  22,
                                  Color.WHITE
                          );


                  /*
                   * Status
                   */
                  statusText =
                          text(
                                  "Not connected",
                                  16,
                                  Color.GRAY
                          );


                  root.addView(
                          sensexText
                  );

                  root.addView(
                          pcrText
                  );

                  root.addView(
                          maxPainText
                  );

                  root.addView(
                          putOiText
                  );

                  root.addView(
                          callOiText
                  );

                  root.addView(
                          statusText
                  );


                  /*
                   * Live wallpaper button
                   */
                  Button wallpaper =
                          new Button(
                                  this
                          );


                  wallpaper.setText(
                          "SET LIVE WALLPAPER"
                  );


                  root.addView(
                          wallpaper
                  );


                  wallpaper.setOnClickListener(
                          v -> openWallpaper()
                  );


                  scroll.addView(
                          root
                  );


                  setContentView(
                          scroll
                  );
              }


              /*
               * Helper method for TextViews.
               */
              private TextView text(
                      String value,
                      int size,
                      int color
              ) {

                  TextView t =
                          new TextView(
                                  this
                          );


                  t.setText(
                          value
                  );


                  t.setTextSize(
                          size
                  );


                  t.setTextColor(
                          color
                  );


                  t.setPadding(
                          0,
                          18,
                          0,
                          18
                  );


                  return t;
              }


              /*
               * Load market data from Upstox.
               */
              private void loadMarketData() {

                  String token =
                          tokenInput
                                  .getText()
                                  .toString()
                                  .trim();


                  if (token.isEmpty()) {

                      statusText.setText(
                              "Enter your Upstox Analytics Token"
                      );

                      return;
                  }


                  statusText.setText(
                          "Updating..."
                  );


                  executor.execute(
                          () -> {

                              try {

                                  String date =
                                          LocalDate
                                                  .now()
                                                  .toString();


                                  String instrument =
                                          URLEncoder
                                                  .encode(
                                                          SENSEX,
                                                          "UTF-8"
                                                  );


                                  String base =
                                          "https://api.upstox.com";


                                  /*
                                   * SENSEX LTP
                                   */
                                  String ltpUrl =
                                          base
                                          + "/v3/market-quote/ltp"
                                          + "?instrument_key="
                                          + instrument;


                                  /*
                                   * PCR
                                   */
                                  String pcrUrl =
                                          base
                                          + "/v2/market/pcr"
                                          + "?instrument_key="
                                          + instrument
                                          + "&expiry=current_week"
                                          + "&date="
                                          + date
                                          + "&bucket_interval=60";


                                  /*
                                   * Max Pain
                                   */
                                  String maxPainUrl =
                                          base
                                          + "/v2/market/max-pain"
                                          + "?instrument_key="
                                          + instrument
                                          + "&expiry=current_week"
                                          + "&date="
                                          + date
                                          + "&bucket_interval=60";


                                  /*
                                   * Open Interest
                                   */
                                  String oiUrl =
                                          base
                                          + "/v2/market/oi"
                                          + "?instrument_key="
                                          + instrument
                                          + "&expiry=current_week"
                                          + "&date="
                                          + date;


                                  String ltp =
                                          get(
                                                  ltpUrl,
                                                  token
                                          );


                                  String pcr =
                                          get(
                                                  pcrUrl,
                                                  token
                                          );


                                  String maxPain =
                                          get(
                                                  maxPainUrl,
                                                  token
                                          );


                                  String oi =
                                          get(
                                                  oiUrl,
                                                  token
                                          );


                                  JSONObject ltpJson =
                                          new JSONObject(
                                                  ltp
                                          );


                                  JSONObject pcrJson =
                                          new JSONObject(
                                                  pcr
                                          );


                                  JSONObject mpJson =
                                          new JSONObject(
                                                  maxPain
                                          );


                                  JSONObject oiJson =
                                          new JSONObject(
                                                  oi
                                          );


                                  /*
                                   * LTP
                                   */
                                  JSONObject ltpData =
                                          ltpJson
                                                  .getJSONObject(
                                                          "data"
                                                  );


                                  JSONObject ltpInstrument =
                                          ltpData
                                                  .getJSONObject(
                                                          SENSEX
                                                  );


                                  double sensex =
                                          ltpInstrument
                                                  .getDouble(
                                                          "last_price"
                                                  );


                                  /*
                                   * PCR
                                   */
                                  double pcrValue =
                                          pcrJson
                                                  .getJSONObject(
                                                          "data"
                                                  )
                                                  .getDouble(
                                                          "pcr"
                                                  );


                                  /*
                                   * Max Pain
                                   */
                                  double maxPainValue =
                                          mpJson
                                                  .getJSONObject(
                                                          "data"
                                                  )
                                                  .getDouble(
                                                          "max_pain"
                                                  );


                                  /*
                                   * OI
                                   */
                                  JSONObject oiData =
                                          oiJson
                                                  .getJSONObject(
                                                          "data"
                                                  );


                                  long puts =
                                          oiData
                                                  .getLong(
                                                          "total_puts"
                                                  );


                                  long calls =
                                          oiData
                                                  .getLong(
                                                          "total_calls"
                                                  );


                                  /*
                                   * Update UI.
                                   */
                                  runOnUiThread(
                                          () -> {

                                              sensexText
                                                      .setText(
                                                              String.format(
                                                                      Locale.US,
                                                                      "SENSEX  %,.2f",
                                                                      sensex
                                                              )
                                                      );


                                              pcrText
                                                      .setText(
                                                              String.format(
                                                                      Locale.US,
                                                                      "PCR  %.4f",
                                                                      pcrValue
                                                              )
                                                      );


                                              maxPainText
                                                      .setText(
                                                              String.format(
                                                                      Locale.US,
                                                                      "MAX PAIN  %,.0f",
                                                                      maxPainValue
                                                              )
                                                      );


                                              putOiText
                                                      .setText(
                                                              String.format(
                                                                      Locale.US,
                                                                      "PUT OI  %,.0f",
                                                                      (double) puts
                                                              )
                                                      );


                                              callOiText
                                                      .setText(
                                                              String.format(
                                                                      Locale.US,
                                                                      "CALL OI  %,.0f",
                                                                      (double) calls
                                                              )
                                                      );


                                              statusText
                                                      .setText(
                                                              "LIVE • "
                                                              + date
                                                      );
                                          }
                                  );


                              } catch (
                                      Exception e
                              ) {

                                  runOnUiThread(
                                          () ->
                                                  statusText
                                                          .setText(
                                                                  "API error: "
                                                                  + e.getMessage()
                                                          )
                                  );
                              }
                          }
                  );
              }


              /*
               * Perform HTTP GET request.
               */
              private String get(
                      String urlString,
                      String token
              ) throws Exception {


                  URL url =
                          new URL(
                                  urlString
                          );


                  HttpURLConnection connection =
                          (HttpURLConnection)
                                  url.openConnection();


                  connection.setRequestMethod(
                          "GET"
                  );


                  connection.setConnectTimeout(
                          15000
                  );


                  connection.setReadTimeout(
                          15000
                  );


                  connection.setRequestProperty(
                          "Accept",
                          "application/json"
                  );


                  connection.setRequestProperty(
                          "Authorization",
                          "Bearer " + token
                  );


                  int code =
                          connection
                                  .getResponseCode();


                  BufferedReader reader;


                  if (
                          code >= 200
                                  && code < 300
                  ) {

                      reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              connection
                                                      .getInputStream()
                                      )
                              );

                  } else {

                      reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              connection
                                                      .getErrorStream()
                                      )
                              );
                  }


                  StringBuilder response =
                          new StringBuilder();


                  String line;


                  while (
                          (line =
                                  reader.readLine())
                                  != null
                  ) {

                      response.append(
                              line
                      );
                  }


                  reader.close();


                  if (
                          code < 200
                                  || code >= 300
                  ) {

                      throw new Exception(
                              "HTTP "
                              + code
                              + ": "
                              + response
                      );
                  }


                  return response.toString();
              }


              /*
               * Open Android Live Wallpaper preview.
               *
               * IMPORTANT:
               * We use WallpaperManager here.
               */
              private void openWallpaper() {

                  try {

                      Intent intent =
                              new Intent(
                                      WallpaperManager
                                              .ACTION_CHANGE_LIVE_WALLPAPER
                              );


                      intent.putExtra(
                              WallpaperManager
                                      .EXTRA_LIVE_WALLPAPER_COMPONENT,

                              new android.content.ComponentName(
                                      this,
                                      SensexWallpaperService.class
                              )
                      );


                      startActivity(
                              intent
                      );


                  } catch (
                          Exception e
                  ) {

                      /*
                       * Fallback:
                       * Open Android live wallpaper chooser.
                       */
                      startActivity(
                              new Intent(
                                      WallpaperManager
                                              .ACTION_LIVE_WALLPAPER_CHOOSER
                              )
                      );
                  }
              }


              /*
               * Notification channel.
               */
              private void createNotificationChannel() {

                  NotificationManager manager =
                          getSystemService(
                                  NotificationManager.class
                          );


                  if (
                          manager == null
                  ) {

                      return;
                  }


                  NotificationChannel channel =
                          new NotificationChannel(
                                  "sensex_alert",
                                  "Sensex Alerts",
                                  NotificationManager
                                          .IMPORTANCE_HIGH
                          );


                  manager.createNotificationChannel(
                          channel
                  );
              }


              @Override
              protected void onDestroy() {

                  handler.removeCallbacks(
                          refreshRunnable
                  );


                  executor.shutdownNow();


                  super.onDestroy();
              }
          }
          EOF


          # =====================================================
          # SensexWallpaperService.java
          # =====================================================

          cat > app/src/main/java/com/praveen/sensexalert/SensexWallpaperService.java <<'EOF'
          package com.praveen.sensexalert;

          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.wallpaper.WallpaperService;
          import android.view.SurfaceHolder;


          public class SensexWallpaperService
                  extends WallpaperService {


              @Override
              public Engine onCreateEngine() {

                  return new SensexEngine();
              }


              private class SensexEngine
                      extends Engine {


                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );


                  /*
                   * WallpaperService.Engine does not
                   * provide getHandler().
                   *
                   * Therefore we maintain our own Handler.
                   */
                  private final Handler handler =
                          new Handler(
                                  Looper.getMainLooper()
                          );


                  /*
                   * Redraw wallpaper every 10 seconds.
                   */
                  private final Runnable drawRunnable =
                          new Runnable() {

                              @Override
                              public void run() {

                                  draw();


                                  if (visible) {

                                      handler.postDelayed(
                                              this,
                                              10000
                                      );
                                  }
                              }
                          };


                  private boolean visible;


                  @Override
                  public void onVisibilityChanged(
                          boolean visible
                  ) {

                      this.visible =
                              visible;


                      if (visible) {

                          drawRunnable.run();

                      } else {

                          handler.removeCallbacks(
                                  drawRunnable
                          );
                      }
                  }


                  @Override
                  public void onSurfaceChanged(
                          SurfaceHolder holder,
                          int format,
                          int width,
                          int height
                  ) {

                      draw();
                  }


                  @Override
                  public void onSurfaceDestroyed(
                          SurfaceHolder holder
                  ) {

                      handler.removeCallbacks(
                              drawRunnable
                      );


                      super.onSurfaceDestroyed(
                              holder
                      );
                  }


                  @Override
                  public void onDestroy() {

                      handler.removeCallbacks(
                              drawRunnable
                      );


                      super.onDestroy();
                  }


                  /*
                   * Draw wallpaper.
                   */
                  private void draw() {

                      SurfaceHolder holder =
                              getSurfaceHolder();


                      Canvas canvas =
                              null;


                      try {

                          canvas =
                                  holder.lockCanvas();


                          if (
                                  canvas == null
                          ) {

                              return;
                          }


                          /*
                           * Background
                           */
                          canvas.drawColor(
                                  Color.BLACK
                          );


                          /*
                           * White text
                           */
                          paint.setColor(
                                  Color.WHITE
                          );


                          paint.setTextAlign(
                                  Paint.Align.CENTER
                          );


                          /*
                           * SENSEX title
                           */
                          paint.setTextSize(
                                  42
                          );


                          canvas.drawText(
                                  "SENSEX",
                                  canvas.getWidth()
                                          / 2f,
                                  120,
                                  paint
                          );


                          /*
                           * Current placeholder
                           *
                           * This will be replaced with
                           * live market values in the
                           * next stage.
                           */
                          paint.setTextSize(
                                  24
                          );


                          canvas.drawText(
                                  "Open SensexAlert",
                                  canvas.getWidth()
                                          / 2f,
                                  180,
                                  paint
                          );


                          /*
                           * Status
                           */
                          paint.setTextSize(
                                  18
                          );


                          paint.setColor(
                                  Color.GRAY
                          );


                          canvas.drawText(
                                  "Live dashboard",
                                  canvas.getWidth()
                                          / 2f,
                                  220,
                                  paint
                          );


                      } finally {

                          if (
                                  canvas != null
                          ) {

                              holder.unlockCanvasAndPost(
                                      canvas
                              );
                          }
                      }
                  }
              }
          }
          EOF


      # =========================================================
      # Build APK
      # =========================================================

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon


      # =========================================================
      # Upload APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SensexAlert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
