name: Build SensexAlert V3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Create project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/praveen/sensexalert
          mkdir -p app/src/main/res/values app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='SensexAlert'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.praveen.sensexalert'
            compileSdk 35
            defaultConfig {
              applicationId 'com.praveen.sensexalert'
              minSdk 26
              targetSdk 35
              versionCode 3
              versionName '3.0'
            }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">SensexAlert</string>
            <string name="wallpaper_description">SENSEX Live Market Dashboard</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"> <item name="android:fontFamily">sans</item> <item name="android:statusBarColor">#000000</item> <item name="android:navigationBarColor">#000000</item> </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/wallpaper.xml <<'EOF'
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description"/>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>

            <application android:allowBackup="true" android:label="@string/app_name" android:theme="@style/AppTheme"> <activity android:name=".MainActivity" android:exported="true"> <intent-filter> <action android:name="android.intent.action.MAIN"/> <category android:name="android.intent.category.LAUNCHER"/> </intent-filter> </activity> <receiver android:name=".AlertReceiver" android:exported="false"/> <service android:name=".SensexWallpaperService" android:exported="true" android:permission="android.permission.BIND_WALLPAPER"> <intent-filter> <action android:name="android.service.wallpaper.WallpaperService"/> </intent-filter> <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper"/> </service> </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/praveen/sensexalert/AlertReceiver.java <<'EOF'
          package com.praveen.sensexalert;

          import android.app.*;
          import android.content.*;
          import android.os.*;

          public class AlertReceiver extends BroadcastReceiver {
            static final String CH="sensex_alert";

            @Override public void onReceive(Context c, Intent i) {
              String title=i.getStringExtra("title");
              String body=i.getStringExtra("body");

              NotificationManager nm=(NotificationManager)c.getSystemService(Context.NOTIFICATION_SERVICE);

              if(Build.VERSION.SDK_INT>=26) {
                nm.createNotificationChannel(
                  new NotificationChannel(CH,"Sensex Alerts",
                    NotificationManager.IMPORTANCE_HIGH));
              }

              Notification.Builder b;
              if(Build.VERSION.SDK_INT>=26)
                b=new Notification.Builder(c,CH);
              else
                b=new Notification.Builder(c);

              b.setSmallIcon(android.R.drawable.ic_dialog_alert)
               .setContentTitle(title==null?"SensexAlert":title)
               .setContentText(body==null?"Alert":body)
               .setAutoCancel(true);

              nm.notify((int)(System.currentTimeMillis()%100000),b.build());
            }
          }
          EOF

          cat > app/src/main/java/com/praveen/sensexalert/SensexWallpaperService.java <<'EOF'
          package com.praveen.sensexalert;

          import android.graphics.*;
          import android.os.*;
          import android.service.wallpaper.WallpaperService;
          import android.view.*;

          public class SensexWallpaperService extends WallpaperService {
            public Engine onCreateEngine(){return new E();}

            class E extends Engine {
              Handler h=new Handler(Looper.getMainLooper());
              boolean visible;

              Runnable r=new Runnable(){
                public void run(){
                  draw();
                  if(visible) h.postDelayed(this,10000);
                }
              };

              public void onVisibilityChanged(boolean v){
                visible=v;
                if(v) r.run(); else h.removeCallbacks(r);
              }

              public void onSurfaceChanged(SurfaceHolder x,int f,int w,int hh){draw();}
              public void onSurfaceDestroyed(SurfaceHolder x){h.removeCallbacks(r);super.onSurfaceDestroyed(x);}
              public void onDestroy(){h.removeCallbacks(r);super.onDestroy();}

              void draw(){
                SurfaceHolder sh=getSurfaceHolder();
                Canvas c=null;

                try{
                  c=sh.lockCanvas();
                  if(c==null)return;

                  c.drawColor(Color.BLACK);

                  Paint p=new Paint(1);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setColor(Color.WHITE);

                  android.content.SharedPreferences s=
                    getSharedPreferences("sensex_alert",0);

                  p.setTextSize(38);
                  c.drawText("SENSEX",c.getWidth()/2f,100,p);

                  p.setTextSize(25);
                  c.drawText(s.getString("sensex","--"),
                    c.getWidth()/2f,155,p);

                  p.setTextSize(18);
                  p.setColor(Color.LTGRAY);

                  c.drawText("Teal position: "+
                    s.getString("position","--"),
                    c.getWidth()/2f,195,p);

                  c.drawText(s.getString("status","Polling OFF"),
                    c.getWidth()/2f,230,p);

                } finally {
                  if(c!=null) sh.unlockCanvasAndPost(c);
                }
              }
            }
          }
          EOF

          cat > app/src/main/java/com/praveen/sensexalert/MainActivity.java <<'EOF'
          package com.praveen.sensexalert;

          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import org.json.*;
          import java.io.*;
          import java.net.*;
          import java.time.*;
          import java.util.*;
          import java.util.concurrent.*;

          public class MainActivity extends Activity {

            static final String P="sensex_alert";
            static final String TOKEN="token";
            static final String SENSEX="BSE_INDEX|SENSEX";

            SharedPreferences sp;
            Handler h=new Handler(Looper.getMainLooper());
            ExecutorService ex=Executors.newSingleThreadExecutor();

            TextView sx,pcr,mp,oi,status,axis;
            EditText token;
            Switch poll;

            @Override
            public void onCreate(Bundle b){
              super.onCreate(b);
              sp=getSharedPreferences(P,0);
              channel();
              ui();
            }

            TextView t(String s,int z){
              TextView x=new TextView(this);
              x.setText(s);
              x.setTextSize(z);
              x.setTextColor(Color.WHITE);
              x.setPadding(0,10,0,10);
              return x;
            }

            Button btn(String s){
              Button b=new Button(this);
              b.setText(s);
              return b;
            }

            void ui(){
              ScrollView sv=new ScrollView(this);
              LinearLayout r=new LinearLayout(this);
              r.setOrientation(LinearLayout.VERTICAL);
              r.setPadding(28,25,28,25);
              r.setBackgroundColor(Color.BLACK);

              r.addView(t("SENSEX ALERT V3",28));

              token=new EditText(this);
              token.setHint("Upstox Analytics Token");
              token.setSingleLine();
              token.setTextColor(Color.WHITE);
              token.setHintTextColor(Color.GRAY);
              token.setText(sp.getString(TOKEN,""));
              r.addView(token);

              Button save=btn("SAVE TOKEN");
              r.addView(save);
              save.setOnClickListener(v->{
                sp.edit().putString(TOKEN,token.getText().toString().trim()).apply();
                refresh();
              });

              poll=new Switch(this);
              poll.setText("LIVE POLLING • 10 SEC");
              poll.setTextColor(Color.WHITE);
              poll.setChecked(sp.getBoolean("poll",false));
              r.addView(poll);

              poll.setOnCheckedChangeListener((b,on)->{
                sp.edit().putBoolean("poll",on).apply();

                h.removeCallbacksAndMessages(null);

                if(on){
                  refresh();
                  h.postDelayed(new Runnable(){
                    public void run(){
                      if(poll.isChecked()){
                        refresh();
                        h.postDelayed(this,10000);
                      }
                    }
                  },10000);
                }else{
                  status.setText("Polling OFF • last values kept");
                }
              });

              sx=t("SENSEX --",27);
              pcr=t("PCR --",21);
              mp=t("MAX PAIN --",21);
              oi=t("OI --",19);
              axis=t("Teal position --",18);
              status=t("Polling OFF",16);

              r.addView(sx);
              r.addView(pcr);
              r.addView(mp);
              r.addView(oi);
              r.addView(axis);
              r.addView(status);

              Button alerts=btn("ALERT SETTINGS");
              r.addView(alerts);
              alerts.setOnClickListener(v->alerts());

              Button times=btn("TIME ALARMS");
              r.addView(times);
              times.setOnClickListener(v->timeList());

              Button wp=btn("SET LIVE WALLPAPER");
              r.addView(wp);
              wp.setOnClickListener(v->wallpaper());

              sv.addView(r);
              setContentView(sv);

              if(poll.isChecked())refresh();
            }

            void alerts(){
              LinearLayout r=new LinearLayout(this);
              r.setOrientation(LinearLayout.VERTICAL);
              r.setPadding(30,10,30,10);

              String[] types={
                "PCR ABOVE","PCR BELOW",
                "SENSEX ABOVE","SENSEX BELOW",
                "TEAL BELOW","TEAL ABOVE"
              };

              for(String type:types){
                EditText e=new EditText(this);
                e.setHint(type+" threshold");
                e.setText(sp.getString("rule_"+type,""));
                e.setInputType(2|8192);

                Switch s=new Switch(this);
                s.setText(type+" enabled");
                s.setChecked(sp.getBoolean("en_"+type,false));

                LinearLayout row=new LinearLayout(this);
                row.setOrientation(LinearLayout.VERTICAL);
                row.addView(e);
                row.addView(s);
                r.addView(row);

                s.setOnCheckedChangeListener((x,on)->
                  sp.edit()
                    .putBoolean("en_"+type,on)
                    .putString("rule_"+type,e.getText().toString())
                    .apply());

                e.setOnFocusChangeListener((v,f)->{
                  if(!f)
                    sp.edit().putString("rule_"+type,
                      e.getText().toString()).apply();
                });
              }

              new AlertDialog.Builder(this)
                .setTitle("Market Alerts")
                .setView(r)
                .setPositiveButton("SAVE",null)
                .setNegativeButton("CLOSE",null)
                .show();
            }

            void timeList(){
              LinearLayout r=new LinearLayout(this);
              r.setOrientation(LinearLayout.VERTICAL);
              r.setPadding(30,10,30,10);

              String list=sp.getString("times","");
              TextView current=t(
                list.isEmpty()?"No time alarms":list,17);
              r.addView(current);

              Button add=btn("+ ADD / MODIFY TIME");
              r.addView(add);

              add.setOnClickListener(v->{
                TimePicker tp=new TimePicker(this);
                tp.setIs24HourView(false);

                new AlertDialog.Builder(this)
                  .setTitle("Set alarm time")
                  .setView(tp)
                  .setPositiveButton("SAVE",(d,w)->{
                    String key=String.format(Locale.US,
                      "%02d:%02d",tp.getHour(),tp.getMinute());

                    sp.edit().putString("times",key).apply();
                    schedule(key);
                    current.setText(key);
                  })
                  .setNegativeButton("CANCEL",null)
                  .show();
              });

              new AlertDialog.Builder(this)
                .setTitle("Time Alarms")
                .setView(r)
                .setNegativeButton("CLOSE",null)
                .show();
            }

            void schedule(String hm){
              try{
                String[] a=hm.split(":");
                Calendar c=Calendar.getInstance();
                c.set(Calendar.HOUR_OF_DAY,Integer.parseInt(a[0]));
                c.set(Calendar.MINUTE,Integer.parseInt(a[1]));
                c.set(Calendar.SECOND,0);

                if(c.getTimeInMillis()<=System.currentTimeMillis())
                  c.add(Calendar.DAY_OF_YEAR,1);

                PendingIntent pi=PendingIntent.getBroadcast(
                  this,hm.hashCode(),
                  new Intent(this,AlertReceiver.class)
                    .putExtra("title","⏰ SENSEX ALERT")
                    .putExtra("body","Scheduled alarm: "+hm),
                  PendingIntent.FLAG_UPDATE_CURRENT|
                  PendingIntent.FLAG_IMMUTABLE);

                ((AlarmManager)getSystemService(ALARM_SERVICE))
                  .setAndAllowWhileIdle(
                    AlarmManager.RTC_WAKEUP,
                    c.getTimeInMillis(),pi);

              }catch(Exception ignored){}
            }

            void refresh(){
              String tk=token.getText().toString().trim();
              if(tk.isEmpty())return;

              ex.execute(()->{
                try{
                  String date=LocalDate.now().toString();

                  JSONObject l=new JSONObject(get(
                    "https://api.upstox.com/v3/market-quote/ltp?instrument_key="+
                    URLEncoder.encode(SENSEX,"UTF-8"),tk));

                  double price=l.getJSONObject("data")
                    .getJSONObject(SENSEX).getDouble("last_price");

                  JSONObject pj=new JSONObject(get(
                    "https://api.upstox.com/v2/market/pcr?instrument_key="+
                    URLEncoder.encode(SENSEX,"UTF-8")+
                    "&expiry=current_week&date="+date+
                    "&bucket_interval=60",tk));

                  double pv=pj.getJSONObject("data")
                    .optDouble("pcr",Double.NaN);

                  JSONObject mj=new JSONObject(get(
                    "https://api.upstox.com/v2/market/max-pain?instrument_key="+
                    URLEncoder.encode(SENSEX,"UTF-8")+
                    "&expiry=current_week&date="+date,tk));

                  double pain=mj.getJSONObject("data")
                    .optDouble("max_pain",Double.NaN);

                  double lo=sp.getFloat("lo",Float.NaN);
                  double hi=sp.getFloat("hi",Float.NaN);

                  if(Double.isNaN(lo)||price<lo)lo=price;
                  if(Double.isNaN(hi)||price>hi)hi=price;

                  if(hi-lo<100){
                    lo=price-50;
                    hi=price+50;
                  }

                  double leftMax=pv>1.0?1.4:1.2;
                  double pos=(price-lo)/(hi-lo)*leftMax;

                  sp.edit()
                    .putFloat("lo",(float)lo)
                    .putFloat("hi",(float)hi)
                    .putString("sensex",
                      String.format(Locale.US,"%,.2f",price))
                    .putString("position",
                      String.format(Locale.US,"%.2f",pos))
                    .putString("status","LIVE • 10 sec")
                    .apply();

                  check("PCR ABOVE",pv);
                  check("PCR BELOW",pv);
                  check("SENSEX ABOVE",price);
                  check("SENSEX BELOW",price);
                  check("TEAL ABOVE",pos);
                  check("TEAL BELOW",pos);

                  final double fPos=pos;
                  final double fLo=lo;
                  final double fHi=hi;
                  final double fLeft=leftMax;

                  runOnUiThread(()->{
                    sx.setText(String.format(Locale.US,
                      "SENSEX %,.2f",price));
                    pcr.setText(String.format(Locale.US,
                      "PCR %.4f",pv));
                    mp.setText(String.format(Locale.US,
                      "MAX PAIN %,.0f",pain));
                    oi.setText("OI • use Upstox analytics");
                    axis.setText(String.format(Locale.US,
                      "Teal position %.2f • axis %.1f • range %,.0f–%,.0f",
                      fPos,fLeft,fLo,fHi));
                    status.setText("LIVE • updated "+
                      LocalTime.now().withNano(0));
                  });

                }catch(Exception e){
                  runOnUiThread(()->
                    status.setText("API error: "+e.getMessage()));
                }
              });
            }

            void check(String type,double value){
              if(Double.isNaN(value)||
                 !sp.getBoolean("en_"+type,false))return;

              try{
                double th=Double.parseDouble(
                  sp.getString("rule_"+type,""));

                boolean above=type.contains("ABOVE");
                boolean crossed=above?value>=th:value<=th;
                String key="last_"+type;
                boolean was=sp.getBoolean(key,false);

                if(crossed&&!was){
                  notifyNow(type,String.format(Locale.US,
                    "%s %.2f crossed %.2f",type,value,th));
                }

                sp.edit().putBoolean(key,crossed).apply();

              }catch(Exception ignored){}
            }

            void notifyNow(String type,String body){
              sendBroadcast(new Intent(this,AlertReceiver.class)
                .putExtra("title","🚨 "+type)
                .putExtra("body",body));
            }

            String get(String u,String tk)throws Exception{
              HttpURLConnection c=(HttpURLConnection)
                new URL(u).openConnection();

              c.setRequestProperty("Authorization","Bearer "+tk);
              c.setRequestProperty("Accept","application/json");
              c.setConnectTimeout(12000);
              c.setReadTimeout(12000);

              int n=c.getResponseCode();

              InputStream in=n>=200&&n<300?
                c.getInputStream():c.getErrorStream();

              BufferedReader br=new BufferedReader(
                new InputStreamReader(in));

              StringBuilder b=new StringBuilder();
              String q;

              while((q=br.readLine())!=null)b.append(q);

              if(n<200||n>=300)
                throw new Exception("HTTP "+n+" "+b);

              return b.toString();
            }

            void channel(){
              NotificationManager n=
                (NotificationManager)getSystemService(
                  NOTIFICATION_SERVICE);

              if(Build.VERSION.SDK_INT>=26)
                n.createNotificationChannel(
                  new NotificationChannel(
                    "sensex_alert","Sensex Alerts",
                    NotificationManager.IMPORTANCE_HIGH));
            }

            void wallpaper(){
              try{
                Intent i=new Intent(
                  WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER);

                i.putExtra(
                  WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                  new ComponentName(
                    this,SensexWallpaperService.class));

                startActivity(i);

              }catch(Exception e){
                startActivity(new Intent(
                  WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER));
              }
            }

            @Override
            protected void onDestroy(){
              h.removeCallbacksAndMessages(null);
              ex.shutdownNow();
              super.onDestroy();
            }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SensexAlert-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
